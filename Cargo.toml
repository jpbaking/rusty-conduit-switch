[package]
name = "rusty-conduit-switch"
version = "2.2.1"
edition = "2021"
description = "Lightweight cross-platform HTTP/HTTPS and SOCKS4/4a/5 Auto Switch proxy server with optional HTTPS MITM inspection"
license = "BSD-3-Clause"

[lib]
name = "rusty_conduit_switch"
path = "src/lib.rs"

[[bin]]
name = "rusty-conduit-switch"
path = "src/main.rs"

[dependencies]
# Extracted proxy engine (modules moved out in E1b; re-exported from crate root)
rusty-conduit-engine = { git = "https://github.com/jpbaking/rusty-conduit-engine", tag = "v0.5.1" }

# Async runtime & utilities
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }

# AirSwitch / SwitchyOmega import: `regex` validates imported regex conditions, `base64`
# decodes base64-encoded `.bak` backups.
regex = "1"
base64 = "0.22"

# Hot-Reload Watcher
# Cross-platform file watching (`kqueue`, `inotify`, `ReadDirectoryChangesW`).
notify = "6"

# CLI, Config & Time
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
humantime = "2"

# Errors
thiserror = "2"

[target.'cfg(unix)'.dependencies]
rlimit = "0.12"
libc = "0.2"

[dev-dependencies]
# Integration-test fixtures (origin servers, MITM/TLS clients, CA generation). The engine
# owns the runtime HTTP/TLS stack; these stay pure-Rust (`ring` provider, no OpenSSL / aws-lc).
bytes = "1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
p12-keystore = "0.4"
x509-parser = "0.18"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
